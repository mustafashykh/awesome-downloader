name: Build release candidates
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      # Enable Corepack on the Node that setup-node installs, so `yarn` is the Yarn 4
      # pinned in package.json rather than the runner's global Yarn 1.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: yarn install --immutable
      - run: yarn test
      - run: yarn dist
      - name: Create SHA-256 file
        shell: powershell
        run: (Get-FileHash release/Awesome-Downloader-Setup.exe -Algorithm SHA256).Hash.ToLower() + '  Awesome-Downloader-Setup.exe' | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: unsigned-windows-release-candidate
          path: |
            release/Awesome-Downloader-Setup.exe
            release/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7
  package-extension:
    # The Chrome Web Store submission package; the same on every platform.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # Enable Corepack on the Node that setup-node installs, so `yarn` is the Yarn 4
      # pinned in package.json rather than the runner's global Yarn 1.
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
      - run: corepack enable
      - run: yarn install --immutable
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      - run: yarn package:extension
      - name: Create SHA-256 file
        working-directory: release-extension
        run: sha256sum Awesome-Downloader-Extension-*.zip > SHA256SUMS-extension.txt
      - uses: actions/upload-artifact@v4
        with:
          name: browser-extension-store-package
          path: |
            release-extension/Awesome-Downloader-Extension-*.zip
            release-extension/SHA256SUMS-extension.txt
          if-no-files-found: error
          retention-days: 7
